<html lang="zh-CN" class="dark">

    <title>SkillSynapse - 代码分析</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              // Custom colors matching Claude's warm aesthetic
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#1c1917',
                950: '#0c0a09',
              },
              claude: {
                bg: '#FAFAF8', // Light mode warm bg
                sidebar: '#F2F2F0', // Light mode sidebar
                darkBg: '#18181b', // Dark mode bg
                darkSidebar: '#202023', // Dark mode sidebar
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['Lora', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FAFAF8; /* Claude Light Bg */
        color: #44403c;
        -webkit-font-smoothing: antialiased;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Dark mode overrides */
      html.dark body {
        background-color: #1c1917; /* Warm dark */
        color: #f5f5f4;
      }

      /* Custom scrollbar - Light Mode */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #d6d3d1; 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a29e; 
      }

      /* Custom scrollbar - Dark Mode */
      html.dark ::-webkit-scrollbar-thumb {
        background: #44403c; 
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #57534e; 
      }
    </style>
